<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuki Café</title>

<style>

/* -------------------- ROOT COLORS & THEMES -------------------- */

:root {
    --gold: #d4af37;
    --dark-bg: #0f0f0f;
    --dark-card: #1a1a1a;
    --dark-text: #f5f5f5;
    --radius: 14px;
}

/* FORCE DARK THEME ALWAYS */
body {
    margin: 0;
    background: url('1111111111110-8d14-8af0590c76ff.jpg') center/cover fixed no-repeat;
    color: var(--dark-text);
    font-family: "Segoe UI", Arial, sans-serif;
}

/* -------------------- HEADER (EMPTY) -------------------- */
header {
    height: 0;
}

/* -------------------- BACK BUTTON -------------------- */

#backBtn {
    position: fixed;
    top: 12px;
    left: 12px;
    padding: 12px 22px;
    border-radius: 18px;
    border: 3px solid var(--gold);
    background: #000;
    color: var(--gold);
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    display: none;
    z-index: 200;
    transition: 0.25s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
}

#backBtn:hover {
    background: var(--gold);
    color: #000;
    transform: translateY(-4px);
}


#backBtn.show {
    display: block;
}

/* -------------------- TOP SMALL BUTTONS -------------------- */

#topBtns {
    position: fixed;
    top: 12px;
    right: 12px;
    display: none;
    z-index: 200;
    gap: 8px;
}

.top-btn {
    padding: 12px 22px;
    border-radius: 18px;
    border: 3px solid var(--gold);
    background: #000;
    color: var(--gold);
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
}

.top-btn:hover {
    background: var(--gold);
    color: #000;
    transform: translateY(-4px);
}
.top-btn.active {
    background: var(--gold);
    color: #000;
}


.top-btn:hover {
    background: var(--gold);
    color: #000;
}

/* -------------------- HOME HERO SCREEN -------------------- */

.home-clean {
    height: 100vh;
    background: url('1111111111110-8d14-8af0590c76ff.jpg') center/cover no-repeat;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.home-clean .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: 1;
}

.clean-title {
    position: relative;
    z-index: 2;
    font-size: 48px;
    color: #fff;
    font-weight: 700;
    margin-bottom: 50px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.8);
}

.clean-buttons {
    position: relative;
    z-index: 2;
    width: 85%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.clean-btn {
    padding: 18px 20px;
    background: var(--dark-card);
    color: var(--gold);
    border: 2px solid var(--gold);
    border-radius: var(--radius);
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s ease;
    box-shadow: 0 6px 22px rgba(0,0,0,0.4);
    text-align: center;
}

.clean-btn:hover {
    background: var(--gold);
    color: #000;
    transform: translateY(-4px);
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}



/* -------------------- PAGES -------------------- */

.page {
    display: none;
    padding: 20px;
    margin-top: 120px;
}

/* -------------------- ACCORDION -------------------- */
.menu-box {
    background: var(--dark-card);
    padding: 20px;
    border-radius: 20px;
    border: 2px solid rgba(212,175,55,0.3);
    box-shadow: 0 6px 22px rgba(0,0,0,0.4);
    max-width: 650px;
    margin: 0 auto;
}

.accordion-item {
    margin-bottom: 14px;
    border: 2px solid var(--gold);
    border-radius: 16px;
    overflow: hidden;
    background: #000;
}

.accordion-header {
    width: 100%;
    padding: 16px;
    background: #000;
    color: var(--gold);
    font-size: 22px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: 0.25s ease;
}

.accordion-header:hover {
    background: var(--gold);
    color: #000;
}

.accordion-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    background: #111;
    padding: 0 14px;
}

.product-line {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #444;
    color: var(--dark-text);
}

.product-line:last-child {
    border-bottom: none;
}

.price {
    color: var(--gold);
    font-weight: bold;
}

.section-title {
    text-align: center;
    font-size: 28px;
    margin-bottom: 25px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.location-box {
    background: var(--dark-card);
    padding: 25px;
    border-radius: 18px;
    border: 2px solid rgba(212, 175, 55, 0.4);
    box-shadow: 0 5px 18px rgba(0,0,0,0.4);
    max-width: 550px;
    margin: 0 auto;
    text-align: center;
}

.loc-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    color: var(--dark-text);
    justify-content: center;
    margin-bottom: 20px;
}

.loc-icon {
    font-size: 26px;
}

.loc-text {
    max-width: 400px;
    line-height: 1.4;
}

.map-btn {
    width: 100%;
    padding: 16px 20px;
    margin-top: 10px;
    background: #000;
    color: var(--gold);
    border: 3px solid var(--gold);
    border-radius: 18px;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
}

.map-btn:hover {
    background: var(--gold);
    color: #000;
    transform: translateY(-4px);
}

.hours {
    margin-top: 30px;
}

.hours h3 {
    color: var(--gold);
    font-size: 22px;
    margin-bottom: 10px;
}

.hours-time {
    font-weight: bold;
    color: var(--gold);
    font-size: 20px;
}
.social-box {
    background: var(--dark-card);
    padding: 25px;
    border-radius: 18px;
    border: 2px solid rgba(212, 175, 55, 0.4);
    box-shadow: 0 5px 18px rgba(0,0,0,0.4);
    max-width: 500px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.social-btn {
    width: 100%;
    padding: 18px 20px;
    background: #000;
    color: var(--gold);
    border: 3px solid var(--gold);
    border-radius: 18px;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s ease;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
}

.social-btn:hover {
    background: var(--gold);
    color: #000;
    transform: translateY(-4px);
}

.accordion-item {
    margin-bottom: 14px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid #333;
    background: var(--dark-card);
}

.accordion-header {
    width: 100%;
    padding: 20px;
    background: var(--dark-card);
    color: var(--dark-text);
    font-size: 20px;
    text-align: center;
    border: none;
    cursor: pointer;
    font-weight: 600;
}

.accordion-body {
    max-height: 0;
    overflow: hidden;
    background: #111;
    transition: max-height 0.4s ease;
    padding: 0 15px;
}

.product-line {
    padding: 14px 0;
    border-bottom: 1px solid #555;
    display: flex;
    justify-content: space-between;
}

.price {
    color: var(--gold);
    font-weight: bold;
}
/* -------------------- MOBILE FIXES -------------------- */
@media (max-width: 600px) {

    .clean-title {
        font-size: 36px;
        margin-bottom: 30px;
    }

    .clean-buttons {
        width: 90%;
        gap: 14px;
    }

    .clean-btn {
        padding: 14px 10px;
        font-size: 20px;
    }

    #topBtns {
        top: 10px;
        right: 10px;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .top-btn {
        padding: 10px 14px;
        font-size: 16px;
    }

    #backBtn {
        padding: 10px 16px;
        font-size: 16px;
        top: 10px;
        left: 10px;
    }

    .section-title {
        font-size: 24px;
        margin-top: 70px;
    }

    .menu-box {
        width: 95%;
        padding: 14px;
    }

    .accordion-header {
        font-size: 18px;
        padding: 14px;
    }

    .product-line {
        font-size: 16px;
        padding: 10px 0;
    }

    .location-box,
    .social-box {
        width: 92%;
        padding: 18px;
    }

    body::before {
        background: rgba(0,0,0,0.65); /* خلفية أغمق للموبايل */
    }
}

</style>
</head>

<body>

<!-- BACK BUTTON -->
<button id="backBtn" onclick="goBack()">←</button>

<!-- TOP BUTTONS -->
<div id="topBtns">
    <button class="top-btn" onclick="openPage('menuPage')">Menu</button>
    <button class="top-btn" onclick="openPage('locationPage')">Location</button>
    <button class="top-btn" onclick="openPage('socialPage')">Social</button>
</div>

<!-- HOME SCREEN -->
<section id="home" class="active home-clean">
    <div class="overlay"></div>

    <h1 id="titleText" class="clean-title">Yuki Café</h1>

    <div class="clean-buttons">
        <button class="clean-btn" onclick="showSection('menuPage')">Menu</button>
        <button class="clean-btn" onclick="showSection('locationPage')">Location</button>
        <button class="clean-btn" onclick="showSection('socialPage')">Social Media</button>
    </div>
</section>

<!-- MENU PAGE -->
<section id="menuPage" class="page">
    <h2 class="section-title">Our Menu</h2>

    <div class="menu-box">

        <!-- HOT DRINKS -->
        <div class="accordion-item">
            <button class="accordion-header"> Hot Drinks</button>
            <div class="accordion-body"></div>
        </div>

        <!-- ICED DRINKS -->
        <div class="accordion-item">
            <button class="accordion-header"> Iced Drinks</button>
            <div class="accordion-body"></div>
        </div>

        <!-- MATCHA -->
        <div class="accordion-item">
            <button class="accordion-header"> Matcha</button>
            <div class="accordion-body"></div>
        </div>

        <!-- TARO -->
        <div class="accordion-item">
            <button class="accordion-header"> Taro Drinks</button>
            <div class="accordion-body"></div>
        </div>

        <!-- JAPANESE MOJITO -->
        <div class="accordion-item">
            <button class="accordion-header"> Japanese Mojito</button>
            <div class="accordion-body"></div>
        </div>

        <!-- MOCHI -->
        <div class="accordion-item">
            <button class="accordion-header"> Mochi</button>
            <div class="accordion-body"></div>
        </div>

        <!-- MILKSHAKE -->
        <div class="accordion-item">
            <button class="accordion-header"> Milkshake</button>
            <div class="accordion-body"></div>
        </div>

        <!-- EXTRAS -->
        <div class="accordion-item">
            <button class="accordion-header"> Extras</button>
            <div class="accordion-body"></div>
        </div>

    </div>
</section>

<!-- LOCATION PAGE -->
<section id="locationPage" class="page">
    <h2 class="section-title">Our Location</h2>

    <div class="location-box">
        <div class="loc-row">
            <span class="loc-icon">📍</span>
            <span class="loc-text">
                Baron Mall – Next to Arab Open University,  
                El Shorouk, Cairo, Egypt
            </span>
        </div>

        <button class="map-btn" onclick="window.open('https://maps.app.goo.gl/FU7dcZFVKwbepaQb8','_blank')">
            View on Google Maps
        </button>

        <div class="hours">
            <h3>Opening Hours</h3>
            <p>Every Day</p>
            <p class="hours-time">10:00 AM – 2:00 AM</p>
        </div>
    </div>
</section>


<!-- SOCIAL PAGE -->
<section id="socialPage" class="page">
    <h2 class="section-title">Social Media</h2>

    <div class="social-box">

        <button class="social-btn" onclick="window.open('https://www.instagram.com/yukicafe.eg/?__d=1%3Futm_source%3Dig_embed','_blank')">
             Instagram
        </button>

        <button class="social-btn" onclick="window.open('https://web.facebook.com/profile.php?id=61584202268275','_blank')">
             Facebook
        </button>

        <button class="social-btn" onclick="window.location.href='tel:01070008500'">
             Call Us
        </button>

        <button class="social-btn" onclick="window.open('https://wa.me/201070008500','_blank')">
             WhatsApp
        </button>

    </div>
</section>

<script>

/* -------------------- PAGE NAVIGATION -------------------- */

function showSection(page) {
    document.getElementById("home").style.display = "none";

    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(page).style.display = "block";

    document.getElementById("backBtn").classList.add("show");
    document.getElementById("topBtns").style.display = "flex";
}

function openPage(page) {
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(page).style.display = "block";
}

function goBack() {
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById("home").style.display = "flex";
    document.getElementById("backBtn").classList.remove("show");
    document.getElementById("topBtns").style.display = "none";
}

/* -------------------- PRODUCT DATA -------------------- */
const products = {

    hot: [
        {name: "Turkish Coffee", price: "35 - 45"},
        {name: "Espresso", price: "40 - 45"},
        {name: "French Coffee", price: "45"},
        {name: "Macchiato", price: "40 - 50"},
        {name: "Cappuccino", price: "70 - 85"},
        {name: "Latte", price: "60 - 75"},
        {name: "Flat White", price: "70 - 85"},
        {name: "American Coffee", price: "50"},
        {name: "Hot Chocolate", price: "70 - 85"},
        {name: "Mocha", price: "75"},
        {name: "White Mocha", price: "75"},
        {name: "Cortado", price: "50"},
        {name: "Spanish Latte", price: "75"},
        {name: "Hot Matcha", price: "80"},
        {name: "Hot Taro Latte", price: "75"},
        {name: "Herbs", price: "20 - 25"},
        {name: "Tea", price: "20"}
    ],

    iced: [
        {name: "Ice Cherry Cola", price: "95 - 110"},
        {name: "Ice Tea Passion", price: "90 - 110"},
        {name: "Ice Tea Peach", price: "90 - 110"},
        {name: "Ice Tea Mango", price: "95 - 115"},
        {name: "Ice Tea Raspberry", price: "95 - 115"},
        {name: "Milk Tea", price: "80 - 105"},
        {name: "Milk Tea (Brown Sugar)", price: "90 - 110"},
        {name: "Iced Latte", price: "85 - 110"},
        {name: "Iced Spanish Latte", price: "95 - 120"},
        {name: "Chocolate Frappe", price: "120 - 145"},
        {name: "Caramel Frappe", price: "120 - 145"},
        {name: "Vanilla Frappe", price: "120 - 145"},
        {name: "Iced Americano", price: "60 - 80"},
        {name: "Iced Mocha", price: "95 - 120"},
        {name: "Iced White Mocha", price: "95 - 120"},
        {name: "Brown Sugar", price: "90 - 110"},
        {name: "Salted Caramel", price: "85 - 105"},
        {name: "Iced Chocolate", price: "85 - 110"}
    ],

    matcha: [
        {name: "Matcha", price: "95 - 110"},
        {name: "Matcha Strawberry", price: "115 - 140"},
        {name: "Matcha Coconut", price: "110 - 135"},
        {name: "Matcha Mango", price: "115 - 140"}
    ],

    taro: [
        {name: "Taro", price: "90 - 105"},
        {name: "Iced Taro Latte", price: "95 - 110"}
    ],

    mojito: [
        {name: "Strawberry", price: "80 - 100"},
        {name: "Mix Berry", price: "85 - 100"},
        {name: "Mango", price: "85 - 105"},
        {name: "Berry", price: "80 - 100"},
        {name: "Passion Fruit", price: "90 - 110"},
        {name: "Peach", price: "80 - 100"},
        {name: "Lychee Bobbing", price: "105"}
    ],

    mochi: [
        {name: "Chocolate", price: "60"},
        {name: "Strawberry", price: "60"},
        {name: "Mango", price: "60"},
        {name: "Red Velvet", price: "60"},
        {name: "Passion Fruit", price: "60"},
        {name: "Cheesecake", price: "70"},
        {name: "Red Bull", price: "70"},
        {name: "Cotton Candy", price: "70"},
        {name: "Vanilla", price: "70"},
        {name: "Sneakers", price: "70"},
        {name: "Mango Coconut", price: "70"},
        {name: "Matcha", price: "75"},
        {name: "Taro", price: "70"},
        {name: "Lemon", price: "60"},
        {name: "Watermelon", price: "60"},
        {name: "Mochi Box 3pcs", price: "150"},
        {name: "Mochi Box 6pcs", price: "270"},
        {name: "Mochi Box 3pcs (Sugar Free)", price: "255"},
        {name: "Mochi Box 6pcs (Sugar Free)", price: "480"},
    ],

    milkshake: [
        {name: "Taro Milkshake", price: "120 - 145"},
        {name: "Matcha Milkshake", price: "120 - 145"},
        {name: "Oreo Milkshake", price: "120 -145"},
        {name: "Bubblegum Milkshake", price: "130 -155"},
        {name: "Chocolate Milkshake", price: "110 -135"},
        {name: "Mango Milkshake", price: "120 -145"}
    ],

    extras: [
        {name: "Boba", price: "25"},
        {name: "Espresso Shot", price: "35"},
        {name: "Flavour", price: "15"}
    ]
};


/* -------------------- ACCORDION LOGIC (FIXED) -------------------- */
/* ترتيب الأقسام بالظبط حسب مكان ظهورهم في HTML */
const categories = ["hot", "iced", "matcha", "taro", "mojito", "mochi", "milkshake", "extras"];

document.querySelectorAll(".accordion-header").forEach((header, index) => {
    header.addEventListener("click", () => {

        const body = header.nextElementSibling;

        // اقفل باقي الأقسام
        document.querySelectorAll(".accordion-body").forEach((b, i) => {
            if (i !== index) b.style.maxHeight = null;
        });

        // فتح/غلق القسم الحالي
        if (body.style.maxHeight) {
            body.style.maxHeight = null;
        } else {
            const key = categories[index];
            let html = "";

            products[key].forEach(p => {
                html += `
                    <div class="product-line">
                        <span>${p.name}</span>
                        <span class="price">${p.price}</span>
                    </div>
                `;
            });

            body.innerHTML = html;
            body.style.maxHeight = body.scrollHeight + "px";
        }
    });
});

/* FORCE ENGLISH + DARK ALWAYS */
document.documentElement.lang = "en";
document.documentElement.dir = "ltr";

</script>

</body>
</html>
